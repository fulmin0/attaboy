<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ATTABOY</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=VT323&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #04050d;
    --bg-grad: radial-gradient(ellipse at 50% 60%, #0a0f24 0%, #04050d 60%, #000 100%);
    --accent: #00f0ff;
    --accent-2: #4afcff;
    --danger: #ff2a6d;
    --gold: #ffd84d;
    --dim: #5a6680;
    --grid: rgba(0, 240, 255, 0.08);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    color: var(--accent);
    font-family: "Orbitron", "Helvetica Neue", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { margin: 0; }

  /* Stage = letterboxed wrapper */
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }
  #stage::before {
    /* faint grid backdrop visible in the letterbox */
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at center, rgba(0,240,255,0.05), transparent 70%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
      #000;
    opacity: 0.5;
    pointer-events: none;
  }

  #frame {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 720px; height: 1080px;
    transform-origin: 0 0;
    background: var(--bg-grad);
    border: 1px solid rgba(0,240,255,0.25);
    box-shadow:
      0 0 0 1px rgba(0,240,255,0.12),
      0 0 80px rgba(0,240,255,0.18),
      inset 0 0 120px rgba(0,0,0,0.6);
    overflow: hidden;
  }

  canvas#game {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    image-rendering: pixelated;
  }

  /* Scanline + vignette overlay */
  #frame::after {
    content: "";
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 1px,
        transparent 1px,
        transparent 3px
      ),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    mix-blend-mode: screen;
    z-index: 50;
  }

  #frame.no-scanlines::after {
    background:
      radial-gradient(ellipse at center, transparent 70%, rgba(0,0,0,0.5) 100%);
  }

  /* ---------------- HUD ---------------- */
  .hud {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 20;
    font-family: "Orbitron", sans-serif;
    color: var(--accent);
    text-shadow: 0 0 8px var(--accent), 0 0 18px rgba(0,240,255,0.4);
  }
  .hud.hidden { display: none; }

  .hud-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 18px 24px 14px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    gap: 16px;
    font-weight: 700;
    letter-spacing: 0.12em;
  }
  .hud-bar::after {
    content: "";
    position: absolute; left: 24px; right: 24px; bottom: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,240,255,0.5), transparent);
  }
  .hud-label {
    font-size: 11px; opacity: 0.6;
    letter-spacing: 0.25em;
    margin-bottom: 4px;
    display: block;
  }
  .hud-value {
    font-size: 28px; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .hud-score { text-align: left; }
  .hud-wave { text-align: center; }
  .hud-wave .hud-value { color: var(--gold); text-shadow: 0 0 8px var(--gold), 0 0 18px rgba(255,216,77,0.4); }
  .hud-lives { text-align: right; }
  .lives-pips { display: flex; gap: 6px; justify-content: flex-end; }
  .pip {
    width: 18px; height: 18px;
    background:
      conic-gradient(from 90deg at 50% 60%, transparent 0 35%, var(--accent) 35% 65%, transparent 65% 100%);
    clip-path: polygon(50% 0, 100% 100%, 50% 80%, 0 100%);
    filter: drop-shadow(0 0 6px var(--accent));
    transition: opacity .25s, transform .25s;
  }
  .pip.lost { opacity: 0.15; transform: scale(.6); filter: none; }

  /* Power-up indicator */
  .powerup-strip {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    bottom: 18px;
    display: flex; gap: 12px;
    z-index: 25;
    pointer-events: none;
  }
  .powerup-badge {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    border: 1px solid currentColor;
    background: rgba(0,0,0,0.4);
    font-size: 12px;
    letter-spacing: 0.18em;
    font-weight: 700;
    text-transform: uppercase;
    box-shadow: 0 0 10px currentColor inset, 0 0 8px currentColor;
  }
  .powerup-badge.multi { color: var(--gold); }
  .powerup-badge.shield { color: var(--accent-2); }
  .powerup-badge.rapid { color: var(--danger); }
  .powerup-badge .bar {
    width: 40px; height: 4px;
    background: rgba(255,255,255,0.15);
    overflow: hidden;
    position: relative;
  }
  .powerup-badge .bar::before {
    content: "";
    position: absolute; inset: 0;
    background: currentColor;
    transform-origin: left center;
    transform: scaleX(var(--p, 1));
  }

  /* ---------------- Screens ---------------- */
  .screen {
    position: absolute; inset: 0;
    z-index: 40;
    display: grid; place-items: center;
    background:
      radial-gradient(ellipse at center, rgba(4,5,13,0.7) 0%, rgba(4,5,13,0.95) 100%);
    backdrop-filter: blur(2px);
    text-align: center;
    color: var(--accent);
    font-family: "Orbitron", sans-serif;
    pointer-events: auto;
  }
  .screen.hidden { display: none; }

  .screen-inner {
    display: flex; flex-direction: column; align-items: center;
    gap: 24px;
    padding: 40px;
    max-width: 600px;
  }

  .logo {
    position: relative;
    font-weight: 900;
    font-size: 108px;
    letter-spacing: 0.16em;
    line-height: 0.9;
    color: var(--accent);
    text-shadow:
      0 0 12px var(--accent),
      0 0 32px rgba(0,240,255,0.55),
      0 0 64px rgba(0,240,255,0.3);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .logo .a { color: var(--gold); text-shadow: 0 0 12px var(--gold), 0 0 32px rgba(255,216,77,0.5); }
  .logo-sub {
    margin-top: 6px;
    font-size: 13px; letter-spacing: 0.5em;
    color: var(--dim);
    text-shadow: none;
  }
  @keyframes pulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.25); }
  }

  .menu-card {
    border: 1px solid rgba(0,240,255,0.4);
    background: rgba(0, 12, 24, 0.55);
    padding: 24px 36px;
    min-width: 360px;
    text-align: left;
    box-shadow: 0 0 24px rgba(0,240,255,0.18) inset;
  }
  .menu-card h3 {
    margin: 0 0 12px;
    font-size: 11px; letter-spacing: 0.4em;
    color: var(--gold); text-shadow: 0 0 6px var(--gold);
    font-weight: 700;
  }
  .menu-card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 14px; letter-spacing: 0.08em; }
  .menu-card dt { color: var(--dim); font-weight: 500; }
  .menu-card dd { margin: 0; color: var(--accent); font-weight: 700; }

  .btn {
    pointer-events: auto;
    appearance: none;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 14px 36px;
    font: 700 18px/1 "Orbitron", sans-serif;
    letter-spacing: 0.4em;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 16px rgba(255,216,77,0.25), 0 0 16px rgba(255,216,77,0.15) inset;
    transition: transform .15s, box-shadow .15s, background .15s;
    text-shadow: 0 0 8px var(--gold);
  }
  .btn:hover, .btn:focus {
    outline: none;
    transform: translateY(-1px);
    background: rgba(255,216,77,0.1);
    box-shadow: 0 0 28px rgba(255,216,77,0.45), 0 0 16px rgba(255,216,77,0.25) inset;
  }
  .btn.primary {
    animation: blink 1.2s steps(2, end) infinite;
  }
  @keyframes blink {
    50% { opacity: 0.55; }
  }
  .btn-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .btn.ghost {
    color: var(--accent);
    border-color: var(--accent);
    text-shadow: 0 0 8px var(--accent);
    box-shadow: 0 0 16px rgba(0,240,255,0.18), 0 0 16px rgba(0,240,255,0.12) inset;
    animation: none;
  }
  .btn.ghost:hover {
    background: rgba(0,240,255,0.08);
    box-shadow: 0 0 28px rgba(0,240,255,0.4), 0 0 16px rgba(0,240,255,0.25) inset;
  }

  .gameover-title {
    font-size: 72px; font-weight: 900; letter-spacing: 0.12em;
    color: var(--danger);
    text-shadow: 0 0 12px var(--danger), 0 0 32px rgba(255,42,109,0.4);
  }
  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px 48px;
    font-size: 16px;
  }
  .stat-grid .label { color: var(--dim); letter-spacing: 0.3em; font-size: 11px; }
  .stat-grid .val {
    font-size: 36px; letter-spacing: 0.06em; line-height: 1.1;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent);
  }
  .stat-grid .val.gold { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
  .stat-grid .val.new { animation: newhi 1s ease-in-out infinite alternate; }
  @keyframes newhi { from { filter: brightness(1); } to { filter: brightness(1.4); } }

  /* Wave intro toast */
  .wave-toast {
    position: absolute;
    top: 38%; left: 50%; transform: translateX(-50%);
    z-index: 30; pointer-events: none;
    text-align: center;
    color: var(--gold);
    text-shadow: 0 0 16px var(--gold), 0 0 32px rgba(255,216,77,0.4);
    font-family: "Orbitron", sans-serif;
    animation: waveIn 2.2s ease-out forwards;
  }
  .wave-toast .label { font-size: 14px; letter-spacing: 0.6em; opacity: 0.7; }
  .wave-toast .num { font-size: 96px; font-weight: 900; line-height: 1; margin-top: 4px; letter-spacing: 0.08em; }
  .wave-toast .name { font-size: 18px; letter-spacing: 0.3em; margin-top: 8px; color: var(--accent); text-shadow: 0 0 8px var(--accent); }
  .wave-toast.boss { color: var(--danger); text-shadow: 0 0 16px var(--danger), 0 0 32px rgba(255,42,109,0.4); }
  .wave-toast.boss .name { color: var(--danger); text-shadow: 0 0 8px var(--danger); }
  @keyframes waveIn {
    0% { opacity: 0; transform: translate(-50%, -10px); }
    15% { opacity: 1; transform: translate(-50%, 0); }
    80% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, 10px); }
  }

  /* Damage flash overlay */
  #flash {
    position: absolute; inset: 0;
    z-index: 35;
    pointer-events: none;
    background: var(--danger);
    opacity: 0;
    mix-blend-mode: screen;
  }

  /* "Attaboy!" callout */
  .attaboy-callout {
    position: absolute;
    z-index: 30; pointer-events: none;
    font-family: "Orbitron", sans-serif;
    font-weight: 900; font-size: 22px;
    letter-spacing: 0.18em;
    color: var(--gold);
    text-shadow: 0 0 8px var(--gold), 0 0 24px rgba(255,216,77,0.6);
    animation: callout 1.1s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes callout {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); }
    20% { opacity: 1; transform: translate(-50%, 0) scale(1.05); }
    100% { opacity: 0; transform: translate(-50%, -30px) scale(1); }
  }

  /* Hint text in corner */
  .hint {
    position: absolute;
    left: 24px; bottom: 18px;
    font-size: 10px; letter-spacing: 0.3em;
    color: var(--dim);
    z-index: 25;
    text-transform: uppercase;
    pointer-events: none;
  }
  .hint span { color: var(--accent); }

  /* Pause overlay */
  .pause-title {
    font-size: 64px; font-weight: 900; letter-spacing: 0.3em;
    color: var(--accent);
    text-shadow: 0 0 16px var(--accent), 0 0 32px rgba(0,240,255,0.4);
  }

  /* Touch controls */
  #touch-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 36px 28px;
    z-index: 15;
    pointer-events: none;
  }
  .tc-btn {
    width: 116px; height: 116px;
    border-radius: 50%;
    border: 2px solid rgba(0,240,255,0.4);
    background: rgba(0,240,255,0.07);
    color: var(--accent);
    font-size: 2.8em;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    pointer-events: auto;
    transition: background .1s, border-color .1s;
  }
  .tc-btn.pressed {
    background: rgba(0,240,255,0.22);
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(0,240,255,0.35);
  }
  .tc-fire {
    border-color: rgba(255,42,109,0.4);
    background: rgba(255,42,109,0.07);
    color: var(--danger);
  }
  .tc-fire.pressed {
    background: rgba(255,42,109,0.25);
    border-color: var(--danger);
    box-shadow: 0 0 20px rgba(255,42,109,0.35);
  }
</style>
</head>
<body data-screen-label="Attaboy Game">
  <div id="stage">
    <div id="frame">
      <canvas id="game" width="720" height="1080"></canvas>

      <!-- Damage flash -->
      <div id="flash"></div>

      <!-- In-game HUD -->
      <div id="hud" class="hud hidden">
        <div class="hud-bar">
          <div class="hud-score">
            <span class="hud-label">SCORE</span>
            <span class="hud-value" id="ui-score">0</span>
          </div>
          <div class="hud-wave">
            <span class="hud-label">WAVE</span>
            <span class="hud-value" id="ui-wave">1</span>
          </div>
          <div class="hud-lives">
            <span class="hud-label">LIVES</span>
            <div class="lives-pips" id="ui-lives"></div>
          </div>
        </div>
        <div class="hint">
          <span>←/→</span> MOVE &nbsp; <span>SPACE</span> FIRE &nbsp; <span>P</span> PAUSE
        </div>
        <div class="powerup-strip" id="ui-powerups"></div>
      </div>

      <!-- Title screen -->
      <div id="screen-title" class="screen">
        <div class="screen-inner">
          <div>
            <div class="logo"><span class="a">A</span>TTABOY</div>
            <div class="logo-sub">A NEON SHOOTER</div>
          </div>
          <div class="menu-card">
            <h3>MISSION BRIEF</h3>
            <dl>
              <dt>OBJECTIVE</dt><dd>SURVIVE THE WAVES</dd>
              <dt>HI&middot;SCORE</dt><dd id="ui-hiscore-title">0</dd>
              <dt>CONTROLS</dt><dd>← → / A D, SPACE</dd>
              <dt>PICK&middot;UPS</dt><dd>M · S · R</dd>
            </dl>
          </div>
          <div class="btn-row">
            <button class="btn primary" id="btn-start">INSERT COIN</button>
          </div>
          <div class="hint" style="position: static; margin-top: 8px;">
            Press <span>SPACE</span> or <span>ENTER</span> to launch
          </div>
        </div>
      </div>

      <!-- Pause screen -->
      <div id="screen-pause" class="screen hidden">
        <div class="screen-inner">
          <div class="pause-title">PAUSED</div>
          <div class="btn-row">
            <button class="btn ghost" id="btn-resume">RESUME</button>
            <button class="btn ghost" id="btn-quit">QUIT</button>
          </div>
          <div class="hint" style="position: static;">Press <span>P</span> to resume</div>
        </div>
      </div>

      <!-- Game over screen -->
      <div id="screen-over" class="screen hidden">
        <div class="screen-inner">
          <div class="gameover-title" id="ui-over-title">GAME OVER</div>
          <div class="stat-grid">
            <div>
              <div class="label">FINAL SCORE</div>
              <div class="val" id="ui-final-score">0</div>
            </div>
            <div>
              <div class="label">WAVE REACHED</div>
              <div class="val" id="ui-final-wave">1</div>
            </div>
            <div>
              <div class="label">HI · SCORE</div>
              <div class="val gold" id="ui-final-hi">0</div>
            </div>
            <div>
              <div class="label">ENEMIES DOWN</div>
              <div class="val" id="ui-final-kills">0</div>
            </div>
          </div>
          <div class="btn-row">
            <button class="btn primary" id="btn-retry">RETRY</button>
            <button class="btn ghost" id="btn-menu">MAIN MENU</button>
          </div>
        </div>
      </div>

      <!-- Touch controls -->
      <div id="touch-bar">
        <button id="tc-left"  class="tc-btn">&#9664;</button>
        <button id="tc-fire"  class="tc-btn tc-fire">&#9679;</button>
        <button id="tc-right" class="tc-btn">&#9654;</button>
      </div>

      <!-- Tweaks mount point -->
      <div id="tweaks-root"></div>
    </div>
  </div>

  <!-- Scale logic: fit 720x1080 frame inside viewport, centered -->
  <script>
    (function () {
      const frame = document.getElementById('frame');
      function fit() {
        const w = window.innerWidth, h = window.innerHeight;
        const s = Math.min(w / 720, h / 1080);
        frame.style.transform = `translate(${-360 * s}px, ${-540 * s}px) scale(${s})`;
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>

  <!-- Game scripts -->
  <script src="audio.js"></script>
  <script src="styles.js"></script>
  <script src="game.js"></script>

  <!-- Touch control wiring -->
  <script>
    (function () {
      function fakeKey(type, code) {
        window.dispatchEvent(new KeyboardEvent(type, { code: code, bubbles: true }));
      }
      function wire(id, code) {
        var el = document.getElementById(id);
        ['touchstart', 'mousedown'].forEach(function (ev) {
          el.addEventListener(ev, function (e) {
            e.preventDefault();
            fakeKey('keydown', code);
            el.classList.add('pressed');
          }, { passive: false });
        });
        ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(function (ev) {
          el.addEventListener(ev, function () {
            fakeKey('keyup', code);
            el.classList.remove('pressed');
          });
        });
      }
      wire('tc-left',  'ArrowLeft');
      wire('tc-right', 'ArrowRight');
      wire('tc-fire',  'Space');
    })();
  </script>

  <!-- Tweaks panel (React) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="tweaks.jsx"></script>
</body>
</html>
